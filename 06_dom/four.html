<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Learning</title>
</head>
<body style="background-color: #212121; color: #ffffff;">
    <ul class="language">
        <li>javascript</li>
    </ul>
    
</body>
<script>
    function addLang (langName) {
        const li = document.createElement('li');
        li.innerHTML = langName;
        document.querySelector('.language').appendChild(li);
    }
    addLang('python');
    addLang('java');


    //OPTIMIZED APPROACH
    function addOptiLang (langName) {
        const li = document.createElement('li');
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li);
    }
    addOptiLang('c++');
    addOptiLang('golang');

    //EDIT

    const firstLang = document.querySelector('li:nth-child(1)');
    // firstLang.innerHTML = "JS";
    // firstLang.replaceChild(document.createTextNode("JS"), firstLang.firstChild);
    const newli = document.createElement('li');
    newli.textContent = "JS";
    firstLang.replaceWith(newli);

    //edit
    const secondLang = document.querySelector('li:nth-child(2)');
    secondLang.textContent = "TypeScript";


    //remove
    const lastLang = document.querySelector('li:last-child');
    lastLang.remove();

</script>
</html>
